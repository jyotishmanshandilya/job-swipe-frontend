<!-- @dsCard group="Patterns" name="Night hero" subtitle="The signature — the one dark moment on the cream canvas" viewport-width="900" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Nunito', system-ui, sans-serif; background: #FFF8ED; color: #292524; }
    .display { font-family: 'Bricolage Grotesque', sans-serif; }
    @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:1} }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .owl { animation: bob 4s ease-in-out infinite; }
  </style>
</head>
<body class="p-8">
  <p class="display text-lg font-extrabold text-stone-500">Night hero — reserved for the landing hero (and "owl is hunting" empty states) only.</p>
  <div class="relative mt-4 overflow-hidden rounded-[2rem] border-2 border-[#211C3D] p-8 md:p-12" style="background:linear-gradient(135deg,#262143,#3B3364)">
    <!-- sky -->
    <span class="star absolute left-8 top-8 text-amber-300">✦</span>
    <span class="star absolute left-1/2 top-6 text-amber-200" style="animation-delay:.6s">✦</span>
    <span class="star absolute right-24 top-16 text-amber-300" style="animation-delay:1.1s">✦</span>
    <svg class="absolute right-8 top-8 h-10 w-10" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="#FDE68A"/><circle cx="30" cy="16" r="16" fill="#2A2549"/></svg>
    <!-- dawn glow -->
    <div class="pointer-events-none absolute inset-x-0 bottom-0 h-24" style="background:linear-gradient(to top, rgba(251,191,36,.25), transparent)"></div>

    <div class="relative flex items-end justify-between gap-8">
      <div class="max-w-md">
        <h1 class="display text-4xl font-extrabold leading-tight tracking-tight text-[#FFF8ED] md:text-5xl">The owl hunts <span class="text-[#FCD34D]">while you sleep.</span></h1>
        <p class="mt-3 text-base font-semibold text-[#CDC8EE]">RoleOwl reads company hiring systems directly — roles appear here first, often a full day before the big boards.</p>
        <div class="mt-6 flex gap-3">
          <button class="rounded-2xl border-2 border-b-4 border-amber-600 bg-amber-400 px-5 py-2.5 text-sm font-extrabold text-amber-950" style="box-shadow:3px 3px 0 0 rgb(0 0 0 / .4)">Start free</button>
          <button class="rounded-2xl border-2 border-b-4 px-5 py-2.5 text-sm font-extrabold text-[#EDEAFF]" style="background:#3E3768;border-color:#4B4478">Log in</button>
        </div>
      </div>
      <div class="owl hidden shrink-0 text-6xl md:block">🦉</div>
    </div>
  </div>
</body>
</html>
